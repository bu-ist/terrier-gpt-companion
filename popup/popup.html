<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TerrierGPT</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>

    <header class="head">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9L12 2.5zm6.5 11l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9.9-2.6z"/></svg>
      </span>
      <div>
        <p class="kicker">TerrierGPT</p>
        <h1>Send this page</h1>
      </div>
    </header>

    <section class="card glass" id="page" aria-live="polite">
      <div class="row">
        <span class="badge tint-azure" id="kind">Page</span>
        <span class="size" id="size"></span>
      </div>
      <p class="title" id="title">Reading the page…</p>
      <p class="host" id="host"></p>
    </section>

    <div class="segmented glass inset" id="modes" role="radiogroup" aria-label="What to send" hidden>
      <button type="button" role="radio" aria-checked="true" data-mode="page" id="mode-page">Whole page</button>
      <button type="button" role="radio" aria-checked="false" data-mode="selection" id="mode-selection">Selection</button>
    </div>

    <button type="button" class="primary" id="send" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4l17.5-7.5c.8-.4.8-1.5 0-1.8L3.4 3.6c-.7-.3-1.4.3-1.3 1l.9 5.6c.1.5.5.8 1 .9L13 12l-9 .9c-.5.1-.9.4-1 .9l-.9 5.6c-.1.7.6 1.3 1.3 1z"/></svg>
      <span id="send-label">Send to TerrierGPT</span>
    </button>

    <p class="status" id="status" role="status"></p>

    <a class="secondary glass" id="open-app" href="terriergpt://capture" hidden>Open TerrierGPT</a>
    <button type="button" class="link" id="open-dock">Open the panel on this page</button>

    <script type="module" src="popup.js"></script>
  </body>
</html>
